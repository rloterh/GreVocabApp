name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, matching local development. jsdom 30 pulls in an undici that
          # needs webidl.util.markAsUncloneable, which Node 20 does not have —
          # the component tests fail to start there. Node 20 is also deprecated
          # on the runners.
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    # The Tauri crate is not exercised by the web build, so nothing else would
    # catch a break in src-tauri. Windows because Tauri builds there without
    # the system libraries a Linux runner would need.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
