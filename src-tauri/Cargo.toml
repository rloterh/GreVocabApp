[package]
name = "lexicon"
version = "0.1.0"
description = "Daily vocabulary practice"
authors = ["Robert"]
edition = "2021"

[lib]
name = "lexicon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Opens the user's real browser for the OpenRouter sign-in, rather than a
# webview inside the app. See docs/adr/0007-authentication-strategy.md.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Folder watching for the desktop build (ROADMAP.md, Phase 4).
notify = "8"
# Scoped HTTP for AI providers; escapes the CORS wall in front of local
# model servers. See docs/adr/0003-rust-http-transport.md.
tauri-plugin-http = "2"
# OS credential store, so API keys are not a JSON blob on disk.
# See docs/adr/0010-secrets-handling.md.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Global shortcut is desktop-only (ROADMAP.md, Phase 4).
tauri-plugin-global-shortcut = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
